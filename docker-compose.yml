services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: role_radar
      POSTGRES_USER: role_radar
      POSTGRES_PASSWORD: role_radar_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U role_radar -d role_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://role_radar:role_radar_password@db:5432/role_radar
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: